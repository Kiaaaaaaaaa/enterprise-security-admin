<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛡️</text></svg>" />
  <title>Enterprise Security Admin Console (Prototype Preview)</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- React 18 & Babel CDN -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>

  <style>
    /* Modern CSS Design System - Dark Cyber & Glassmorphism Theme */
    :root {
      --bg-primary: #0b0f19;
      --bg-secondary: #161b26;
      --bg-tertiary: #1f2635;
      --bg-card: rgba(22, 27, 38, 0.7);
      --border-color: rgba(255, 255, 255, 0.08);
      --border-focus: rgba(59, 130, 246, 0.5);
      
      --text-primary: #f3f4f6;
      --text-secondary: #9ca3af;
      --text-muted: #6b7280;
      
      --accent-blue: #3b82f6;
      --accent-blue-hover: #2563eb;
      --accent-teal: #14b8a6;
      --accent-teal-glow: rgba(20, 184, 166, 0.15);
      --accent-red: #ef4444;
      --accent-red-glow: rgba(239, 68, 68, 0.15);
      --accent-amber: #f59e0b;
      --accent-amber-glow: rgba(245, 158, 11, 0.15);
      --accent-purple: #8b5cf6;
      
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.2), 0 4px 6px -2px rgba(0, 0, 0, 0.1);
      --shadow-glow: 0 0 15px rgba(59, 130, 246, 0.25);
      
      --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --transition-fast: 0.15s ease;
      --transition-normal: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-family: var(--font-sans);
      min-height: 100vh;
      overflow: hidden;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg-primary);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--bg-tertiary);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #374151;
    }

    .app-container {
      display: flex;
      min-height: 100vh;
      height: 100vh;
    }

    .sidebar {
      width: 260px;
      background-color: var(--bg-secondary);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      height: 100vh;
      z-index: 40;
    }

    .main-content {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      height: 100vh;
      overflow-y: auto;
    }

    .header {
      height: 70px;
      background-color: rgba(22, 27, 38, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2rem;
      position: sticky;
      top: 0;
      z-index: 30;
      flex-shrink: 0;
    }

    .page-container {
      padding: 2rem;
      flex-grow: 1;
      animation: fadeIn var(--transition-normal) forwards;
    }

    .card {
      background-color: var(--bg-card);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      box-shadow: var(--shadow-md);
      transition: transform var(--transition-normal), box-shadow var(--transition-normal), border-color var(--transition-normal);
    }

    .card:hover {
      border-color: rgba(255, 255, 255, 0.12);
      box-shadow: 0 8px 16px -4px rgba(0, 0, 0, 0.3);
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.875rem 1.25rem;
      color: var(--text-secondary);
      text-decoration: none;
      border-radius: 8px;
      margin: 0.25rem 0.75rem;
      font-weight: 500;
      cursor: pointer;
      transition: all var(--transition-fast);
    }

    .nav-item:hover, .nav-item.active {
      color: var(--text-primary);
      background-color: var(--bg-tertiary);
    }

    .nav-item.active {
      border-left: 3px solid var(--accent-blue);
      background: linear-gradient(90deg, var(--bg-tertiary) 0%, rgba(59, 130, 246, 0.05) 100%);
    }

    h1, h2, h3, h4, h5, h6 {
      color: var(--text-primary);
      font-weight: 600;
      letter-spacing: -0.025em;
    }

    .section-title {
      font-size: 1.5rem;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.625rem 1.25rem;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.875rem;
      cursor: pointer;
      transition: all var(--transition-fast);
      border: 1px solid transparent;
      user-select: none;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-primary {
      background-color: var(--accent-blue);
      color: white;
    }
    .btn-primary:hover:not(:disabled) {
      background-color: var(--accent-blue-hover);
      box-shadow: var(--shadow-glow);
    }

    .btn-secondary {
      background-color: var(--bg-tertiary);
      border-color: var(--border-color);
      color: var(--text-primary);
    }
    .btn-secondary:hover:not(:disabled) {
      background-color: rgba(255, 255, 255, 0.05);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .btn-danger {
      background-color: rgba(239, 68, 68, 0.15);
      color: var(--accent-red);
      border: 1px solid rgba(239, 68, 68, 0.3);
    }
    .btn-danger:hover:not(:disabled) {
      background-color: var(--accent-red);
      color: white;
      box-shadow: 0 0 15px rgba(239, 68, 68, 0.25);
    }

    .btn-success {
      background-color: rgba(20, 184, 166, 0.15);
      color: var(--accent-teal);
      border: 1px solid rgba(20, 184, 166, 0.3);
    }
    .btn-success:hover:not(:disabled) {
      background-color: var(--accent-teal);
      color: white;
      box-shadow: 0 0 15px rgba(20, 184, 166, 0.25);
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-label {
      display: block;
      font-size: 0.875rem;
      font-weight: 500;
      margin-bottom: 0.5rem;
      color: var(--text-secondary);
    }

    .form-control {
      width: 100%;
      padding: 0.75rem 1rem;
      background-color: rgba(11, 15, 25, 0.6);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-primary);
      font-family: inherit;
      transition: all var(--transition-fast);
    }

    .form-control:focus {
      outline: none;
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.25);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 0.25rem 0.625rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .badge-info {
      background-color: rgba(59, 130, 246, 0.15);
      color: var(--accent-blue);
    }

    .badge-success {
      background-color: rgba(20, 184, 166, 0.15);
      color: var(--accent-teal);
    }

    .badge-warning {
      background-color: rgba(245, 158, 11, 0.15);
      color: var(--accent-amber);
    }

    .badge-danger {
      background-color: rgba(239, 68, 68, 0.15);
      color: var(--accent-red);
    }

    .table-container {
      overflow-x: auto;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .admin-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    .admin-table th {
      background-color: rgba(31, 38, 53, 0.4);
      padding: 1rem 1.25rem;
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text-secondary);
      border-bottom: 1px solid var(--border-color);
    }

    .admin-table td {
      padding: 1rem 1.25rem;
      font-size: 0.875rem;
      border-bottom: 1px solid var(--border-color);
      color: var(--text-primary);
      vertical-align: middle;
    }

    .admin-table tr:last-child td {
      border-bottom: none;
    }

    .admin-table tbody tr {
      transition: background-color var(--transition-fast);
    }

    .admin-table tbody tr:hover {
      background-color: rgba(255, 255, 255, 0.02);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .pulse-indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
      animation: pulse 2s infinite;
    }

    .pulse-green { background-color: var(--accent-teal); box-shadow: 0 0 8px var(--accent-teal); }
    .pulse-red { background-color: var(--accent-red); box-shadow: 0 0 8px var(--accent-red); }
    .pulse-orange { background-color: var(--accent-amber); box-shadow: 0 0 8px var(--accent-amber); }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .metric-card {
      display: flex;
      align-items: center;
      gap: 1.25rem;
    }

    .metric-icon-wrapper {
      width: 48px;
      height: 48px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--bg-tertiary);
      color: var(--accent-blue);
      border: 1px solid var(--border-color);
    }

    .metric-info h4 {
      font-size: 0.875rem;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .metric-info p {
      font-size: 1.75rem;
      font-weight: 700;
      margin-top: 0.25rem;
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 50;
      animation: fadeIn 0.2s ease;
    }

    .modal-content {
      background-color: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      width: 100%;
      max-width: 500px;
      padding: 2rem;
      box-shadow: var(--shadow-lg);
      position: relative;
    }

    .modal-title {
      margin-bottom: 1.5rem;
      font-size: 1.25rem;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 0.75rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-close {
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 1.5rem;
      cursor: pointer;
    }

    .modal-footer {
      margin-top: 2rem;
      display: flex;
      justify-content: flex-end;
      gap: 0.75rem;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- React JSX Application Code -->
  <script type="text/babel">
    const { useState, useEffect } = React;

    let BACKEND_URL = "https://admin-api-server.onrender.com/api/admin";
    const LOCAL_BACKEND_URL = "http://localhost:8080/api/admin";
    const REMOTE_BACKEND_URL = "https://admin-api-server.onrender.com/api/admin";

    // ==========================================
    // 1. LOGIN COMPONENT
    // ==========================================
    function Login({ onLoginSuccess }) {
      const [username, setUsername] = useState('admin');
      const [password, setPassword] = useState('admin1234');
      const [loadingStep, setLoadingStep] = useState(0);
      const [isAnalyzing, setIsAnalyzing] = useState(false);
      const [clientPcInfo, setClientPcInfo] = useState(null);

      useEffect(() => {
        setClientPcInfo({
          os: "Windows 11 Enterprise x64",
          browser: "Chrome 125.0 (Windows NT 10.0)",
          ip: "211.234.56.78",
          macAddress: "E4-A8-DF-92-11-BC",
          hostname: "SEC-DESKTOP-889",
          isVirtual: false,
          debuggerDetected: false
        });
      }, []);

      const handleLogin = (e) => {
        e.preventDefault();
        setIsAnalyzing(true);
        setLoadingStep(1);

        setTimeout(() => {
          setLoadingStep(2);
          setTimeout(() => {
            setLoadingStep(3);
            setTimeout(() => {
              setIsAnalyzing(false);
              onLoginSuccess({
                id: username,
                role: "SUPER_ADMIN",
                name: "최고 관리자",
                pcInfo: clientPcInfo
              });
            }, 1200);
          }, 1000);
        }, 800);
      };

      return (
        <div style={{
          minHeight: '100vh',
          display: 'flex',
          alignItems: 'center',
          justifyContent: 'center',
          background: 'radial-gradient(circle at center, #1e293b 0%, #0f172a 100%)',
          padding: '1rem'
        }}>
          <div className="card" style={{ width: '100%', maxWidth: '440px', padding: '2.5rem', backgroundColor: 'rgba(30, 41, 59, 0.7)' }}>
            <div style={{ textAlign: 'center', marginBottom: '2rem' }}>
              <div style={{ fontSize: '3rem', marginBottom: '0.5rem' }}>🛡️</div>
              <h2 style={{ fontSize: '1.5rem', fontWeight: '800', background: 'linear-gradient(to right, #60a5fa, #34d399)', WebkitBackgroundClip: 'text', WebkitTextFillColor: 'transparent' }}>
                Enterprise Security Admin
              </h2>
              <p style={{ color: 'var(--text-secondary)', fontSize: '0.875rem', marginTop: '0.5rem' }}>
                관리자 웹 콘솔 통합 인증 데모
              </p>
            </div>

            {!isAnalyzing ? (
              <form onSubmit={handleLogin}>
                <div className="form-group">
                  <label className="form-label">관리자 계정 ID</label>
                  <input
                    type="text"
                    className="form-control"
                    value={username}
                    onChange={(e) => setUsername(e.target.value)}
                    placeholder="ID를 입력하세요"
                    required
                  />
                </div>
                
                <div className="form-group" style={{ marginBottom: '2rem' }}>
                  <label className="form-label">비밀번호</label>
                  <input
                    type="password"
                    className="form-control"
                    value={password}
                    onChange={(e) => setPassword(e.target.value)}
                    placeholder="비밀번호를 입력하세요"
                    required
                  />
                </div>

                <button type="submit" className="btn btn-primary" style={{ width: '100%', padding: '0.875rem' }}>
                  인증 및 세션 연결 시작
                </button>
                
                <div style={{ marginTop: '1.5rem', padding: '0.75rem', borderRadius: '6px', backgroundColor: 'rgba(255,255,255,0.03)', border: '1px solid rgba(255,255,255,0.05)', fontSize: '0.75rem', color: 'var(--text-muted)' }}>
                  <strong>데모 계정:</strong> admin / admin1234
                </div>
              </form>
            ) : (
              <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', padding: '1rem 0' }}>
                <div style={{
                  width: '50px',
                  height: '50px',
                  border: '3px solid rgba(59, 130, 246, 0.1)',
                  borderTop: '3px solid var(--accent-blue)',
                  borderRadius: '50%',
                  animation: 'spin 1s linear infinite',
                  marginBottom: '2rem'
                }} />
                
                <h3 style={{ fontSize: '1.1rem', marginBottom: '1.5rem' }}>보안 분석 진행 중...</h3>
                
                <div style={{ width: '100%', display: 'flex', flexDirection: 'column', gap: '0.875rem' }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: '0.75rem', fontSize: '0.875rem', color: loadingStep >= 1 ? 'var(--text-primary)' : 'var(--text-muted)' }}>
                    <span className={`pulse-indicator ${loadingStep >= 1 ? 'pulse-green' : 'pulse-orange'}`} />
                    <span>[1단계] PC 정보 수집 및 에이전트 검증</span>
                    {loadingStep >= 1 && <span style={{ marginLeft: 'auto', color: 'var(--accent-teal)', fontSize: '0.75rem' }}>완료</span>}
                  </div>
                  {loadingStep >= 1 && (
                    <div style={{ fontSize: '0.75rem', color: 'var(--text-secondary)', paddingLeft: '1.5rem', fontFamily: 'var(--font-mono)' }}>
                      OS: {clientPcInfo?.os} | MAC: {clientPcInfo?.macAddress}
                    </div>
                  )}

                  <div style={{ display: 'flex', alignItems: 'center', gap: '0.75rem', fontSize: '0.875rem', color: loadingStep >= 2 ? 'var(--text-primary)' : 'var(--text-muted)' }}>
                    <span className={`pulse-indicator ${loadingStep >= 2 ? 'pulse-green' : (loadingStep === 1 ? 'pulse-orange' : 'pulse-red')}`} />
                    <span>[2단계] 요청 IP 대역 및 네트워크 검증</span>
                    {loadingStep >= 2 && <span style={{ marginLeft: 'auto', color: 'var(--accent-teal)', fontSize: '0.75rem' }}>완료</span>}
                  </div>
                  {loadingStep >= 2 && (
                    <div style={{ fontSize: '0.75rem', color: 'var(--text-secondary)', paddingLeft: '1.5rem', fontFamily: 'var(--font-mono)' }}>
                      Request IP: {clientPcInfo?.ip} (KT Broadband)
                    </div>
                  )}

                  <div style={{ display: 'flex', alignItems: 'center', gap: '0.75rem', fontSize: '0.875rem', color: loadingStep >= 3 ? 'var(--text-primary)' : 'var(--text-muted)' }}>
                    <span className={`pulse-indicator ${loadingStep >= 3 ? 'pulse-green' : (loadingStep === 2 ? 'pulse-orange' : 'pulse-red')}`} />
                    <span>[3단계] 위험요소(Risk Factors) 분석 평가</span>
                    {loadingStep >= 3 && <span style={{ marginLeft: 'auto', color: 'var(--accent-teal)', fontSize: '0.75rem' }}>완료 (정상)</span>}
                  </div>
                </div>
              </div>
            )}
          </div>
          <style>{`
            @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
          `}</style>
        </div>
      );
    }

    // ==========================================
    // 2. DASHBOARD COMPONENT
    // ==========================================
    function Dashboard({ sessions, auditLogs, users }) {
      const [testIp, setTestIp] = useState('192.168.12.104');
      const [testOs, setTestOs] = useState('Windows 11 x64');
      const [testMac, setTestMac] = useState('00-50-56-C0-00-08');
      const [hasDebugger, setHasDebugger] = useState(false);
      const [isVm, setIsVm] = useState(false);
      const [calculatedRisk, setCalculatedRisk] = useState(null);

      const activeSessionsCount = sessions.filter(s => s.status === 'ACTIVE').length;
      const highRiskSessionsCount = sessions.filter(s => s.riskLevel === 'HIGH').length;

      const runRiskAnalysis = () => {
        let score = 0;
        let factors = [];

        if (!(testIp.startsWith('10.') || testIp.startsWith('192.168.'))) {
          score += 15;
          factors.push("외부 공인 IP 접근 (공용 망)");
        }
        if (testMac.startsWith('00-50-56') || testMac.startsWith('00-0C-29')) {
          score += 30;
          factors.push("VMware 가상 MAC 어드레스 검출");
        }
        if (isVm) {
          score += 20;
          factors.push("가상 머신 실행 차단 규칙 매칭");
        }
        if (hasDebugger) {
          score += 50;
          factors.push("C# Client: 디버깅 포트 활성화 탐지 (x64dbg)");
        }

        let level = "LOW";
        if (score >= 60) level = "HIGH";
        else if (score >= 30) level = "MEDIUM";

        setCalculatedRisk({
          score,
          level,
          factors: factors.length > 0 ? factors : ["탐지된 특이사항 없음 (정상 PC)"]
        });
      };

      return (
        <div className="page-container">
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '2rem' }}>
            <div>
              <h1 style={{ fontSize: '1.875rem', fontWeight: '800' }}>시스템 현황판</h1>
              <p style={{ color: 'var(--text-secondary)', fontSize: '0.875rem', marginTop: '0.25rem' }}>
                Redis 세션 클러스터 및 C# 클라이언트 통신 실시간 통계
              </p>
            </div>
            <div style={{ display: 'flex', gap: '0.75rem' }}>
              <span className="badge badge-success" style={{ padding: '0.5rem 1rem' }}>
                <span className="pulse-indicator pulse-green" style={{ marginRight: '0.5rem' }} />
                Redis 세션 서버 정상
              </span>
              <span className="badge badge-info" style={{ padding: '0.5rem 1rem' }}>
                PostgreSQL 동기화 완료
              </span>
            </div>
          </div>

          <div className="metrics-grid">

    function SessionManager({ sessions, onCreateSession, onRenewSession, onForceLogout }) {
      const [showCreateModal, setShowCreateModal] = useState(false);
      const [newSessionUser, setNewSessionUser] = useState('');
      const [newSessionIp, setNewSessionIp] = useState('192.168.1.15');
      const [newSessionClientType, setNewSessionClientType] = useState('WPF');
      const [newSessionMac, setNewSessionMac] = useState('B2-C3-E4-91-F3-0A');

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!newSessionUser) return;
        onCreateSession({
          userId: newSessionUser,
          ip: newSessionIp,
          clientType: newSessionClientType,
          macAddress: newSessionMac,
          os: newSessionClientType === 'WPF' ? 'Windows 11 x64' : 'MacOS Sonoma (Web)',
          browser: newSessionClientType === 'WPF' ? 'WPF Client Embedded' : 'Chrome 125',
          riskLevel: 'LOW'
        });
        setNewSessionUser('');
        setShowCreateModal(false);
      };

      return (
        <div className="page-container">
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '2rem' }}>
            <div>
              <h1 style={{ fontSize: '1.875rem', fontWeight: '800' }}>Redis 세션 관리 (Session CRUD)</h1>
              <p style={{ color: 'var(--text-secondary)', fontSize: '0.875rem', marginTop: '0.25rem' }}>
                서버 메모리(Redis) 상의 액티브 세션 리스트 조회, 세션 강제 종료 및 주기 연장 기능
              </p>
            </div>
            <button className="btn btn-primary" onClick={() => setShowCreateModal(true)}>➕ 신규 세션 임의 발행 (Create)</button>
          </div>

          <div className="card">
            <div className="table-container">
              <table className="admin-table">
                <thead>
                  <tr>
                    <th>세션 ID</th>
                    <th>대상 유저</th>
                    <th>클라이언트 형태</th>
                    <th>접속 IP</th>
                    <th>맥 주소 (MAC)</th>
                    <th>남은 시간</th>
                    <th>위험 수준</th>
                    <th>상태</th>
                    <th style={{ textAlign: 'center' }}>조치</th>
                  </tr>
                </thead>
                <tbody>
                  {sessions.length === 0 ? (
                    <tr>
                      <td colSpan="9" style={{ textAlign: 'center', color: 'var(--text-muted)', padding: '2rem' }}>활성화된 세션이 없습니다.</td>
                    </tr>
                  ) : (
                    sessions.map((session) => (
                      <tr key={session.id}>
                        <td style={{ fontFamily: 'var(--font-mono)', fontSize: '0.75rem', color: 'var(--text-secondary)' }}>{session.id.substring(0, 15)}...</td>
                        <td style={{ fontWeight: '600' }}>{session.userId}</td>
                        <td>
                          <span className={`badge ${session.clientType === 'WPF' ? 'badge-info' : 'badge-success'}`}>
                            {session.clientType === 'WPF' ? '💻 C# WPF App' : '🌐 Web Browser'}
                          </span>
                        </td>
                        <td style={{ fontFamily: 'var(--font-mono)' }}>{session.ip}</td>
                        <td style={{ fontFamily: 'var(--font-mono)', fontSize: '0.8rem', color: 'var(--text-secondary)' }}>{session.macAddress}</td>
                        <td style={{ fontFamily: 'var(--font-mono)', fontWeight: '600' }}>{session.expiresIn} 분</td>
                        <td>
                          <span className={`badge ${session.riskLevel === 'HIGH' ? 'badge-danger' : (session.riskLevel === 'MEDIUM' ? 'badge-warning' : 'badge-success')}`}>{session.riskLevel}</span>
                        </td>
                        <td>
                          <span style={{ display: 'flex', alignItems: 'center', gap: '0.375rem' }}>
                            <span className={`pulse-indicator ${session.status === 'ACTIVE' ? 'pulse-green' : 'pulse-red'}`} />
                            <span>{session.status}</span>
                          </span>
                        </td>
                        <td>
                          <div style={{ display: 'flex', gap: '0.5rem', justifyContent: 'center' }}>
                            <button className="btn btn-secondary" style={{ padding: '0.375rem 0.75rem', fontSize: '0.75rem' }} onClick={() => onRenewSession(session.id)} disabled={session.status !== 'ACTIVE'}>🔄 갱신</button>
                            <button className="btn btn-danger" style={{ padding: '0.375rem 0.75rem', fontSize: '0.75rem' }} onClick={() => onForceLogout(session.id)} disabled={session.status !== 'ACTIVE'}>🚫 강제로그아웃</button>
                          </div>
                        </td>
                      </tr>
                    ))
                  )}
                </tbody>
              </table>
            </div>
          </div>

          {showCreateModal && (
            <div className="modal-overlay">
              <div className="modal-content">
                <div className="modal-title">
                  <h3>Redis 임의 세션 발급</h3>
                  <button className="modal-close" onClick={() => setShowCreateModal(false)}>&times;</button>
                </div>
                <form onSubmit={handleSubmit}>
                  <div className="form-group">
                    <label className="form-label">대상 사용자 ID</label>
                    <input type="text" className="form-control" value={newSessionUser} onChange={(e) => setNewSessionUser(e.target.value)} required />
                  </div>
                  <div className="form-group">
                    <label className="form-label">클라이언트 플랫폼</label>
                    <select className="form-control" value={newSessionClientType} onChange={(e) => setNewSessionClientType(e.target.value)}>
                      <option value="WPF">C# WPF Client</option>
                      <option value="WEB">Web Browser</option>
                    </select>
                  </div>
                  <div className="form-group">
                    <label className="form-label">발생 IP 주소</label>
                    <input type="text" className="form-control" value={newSessionIp} onChange={(e) => setNewSessionIp(e.target.value)} required />
                  </div>
                  <div className="form-group">
                    <label className="form-label">맥 주소 (MAC)</label>
                    <input type="text" className="form-control" value={newSessionMac} onChange={(e) => setNewSessionMac(e.target.value)} required />
                  </div>
                  <div className="modal-footer">
                    <button type="button" className="btn btn-secondary" onClick={() => setShowCreateModal(false)}>취소</button>
                    <button type="submit" className="btn btn-primary">발급 완료</button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    function AuditLogs({ auditLogs }) {
      const [searchTerm, setSearchTerm] = useState('');
      const [actionFilter, setActionFilter] = useState('ALL');

      const filteredLogs = auditLogs.filter(log => {
        const matchesSearch = log.userId.toLowerCase().includes(searchTerm.toLowerCase()) || 
                              log.ip.includes(searchTerm) || 
                              log.pcInfo.toLowerCase().includes(searchTerm.toLowerCase());
        const matchesAction = actionFilter === 'ALL' || log.actionCategory === actionFilter;
        return matchesSearch && matchesAction;
      });

      return (
        <div className="page-container">
          <div style={{ marginBottom: '2rem' }}>
            <h1 style={{ fontSize: '1.875rem', fontWeight: '800' }}>보안 감사 로그 (Audit Logs)</h1>
            <p style={{ color: 'var(--text-secondary)', fontSize: '0.875rem', marginTop: '0.25rem' }}>
              사용자 로그인, C# WPF 에이전트 정보 수집, 세션 갱신 및 강제 로그아웃 대장 조회
            </p>
          </div>

          <div className="card" style={{ padding: '1.25rem', marginBottom: '1.5rem' }}>
            <div style={{ display: 'flex', gap: '1rem' }}>
              <div style={{ flex: '1' }}>
                <label className="form-label">검색어 (ID, IP, 디바이스)</label>
                <input type="text" className="form-control" placeholder="검색어를 입력하세요..." value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} />
              </div>
              <div style={{ width: '200px' }}>
                <label className="form-label">구분 필터</label>
                <select className="form-control" value={actionFilter} onChange={(e) => setActionFilter(e.target.value)}>
                  <option value="ALL">전체 보기</option>
                  <option value="LOGIN">로그인 / 인증</option>
                  <option value="SESSION_OP">세션 작업</option>
                  <option value="FORCE_LOGOUT">강제 로그아웃</option>
                  <option value="SECURITY_WARN">보안 위험 감지</option>
                </select>
              </div>
            </div>
          </div>

          <div className="card">
            <div className="table-container">
              <table className="admin-table">
                <thead>
                  <tr>
                    <th>기록 일시</th>
                    <th>로그 구분</th>
                    <th>대상 계정</th>
                    <th>상세 행위</th>
                    <th>발생 IP 주소</th>
                    <th>디바이스 정보</th>
                  </tr>
                </thead>
                <tbody>
                  {filteredLogs.map((log) => (
                    <tr key={log.id}>
                      <td style={{ fontFamily: 'var(--font-mono)', color: 'var(--text-muted)' }}>{log.timestamp}</td>
                      <td>
                        <span className={`badge ${log.actionCategory === 'SECURITY_WARN' ? 'badge-danger' : (log.actionCategory === 'FORCE_LOGOUT' ? 'badge-warning' : (log.actionCategory === 'LOGIN' ? 'badge-success' : 'badge-info'))}`}>
                          {log.actionCategory}
                        </span>
                      </td>
                      <td style={{ fontWeight: '600' }}>{log.userId}</td>
                      <td>
                        <div>{log.action}</div>
                        <div style={{ fontSize: '0.75rem', color: 'var(--text-muted)' }}>{log.detail}</div>
                      </td>
                      <td style={{ fontFamily: 'var(--font-mono)' }}>{log.ip}</td>
                      <td style={{ fontSize: '0.8rem', color: 'var(--text-secondary)' }}>{log.pcInfo}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

        // 1. Try local backend first
        try {
          const healthRes = await fetch(`${LOCAL_BACKEND_URL}/health`, { signal: AbortSignal.timeout(800) });
          if (healthRes.ok) {
            BACKEND_URL = LOCAL_BACKEND_URL;

            if (sessRes.ok) setSessions(await sessRes.json());

            const userRes = await fetch(`${BACKEND_URL}/users`);
            if (userRes.ok) setUsers(await userRes.json());

            return;
          }
        } catch (e) {
          // ignore local error
        }

        // 2. Try remote backend next
        try {
          const healthRes = await fetch(`${REMOTE_BACKEND_URL}/health`, { signal: AbortSignal.timeout(1500) });

            if (sessRes.ok) setSessions(await sessRes.json());

            return;
          }
        } catch (e) {
          // ignore remote error
        }

                timestamp: new Date().toISOString().replace('T', ' ').substring(0, 19),
                userId: currentUser?.id || "SYSTEM",
                action: "C# WPF / 웹 세션 강제 종료 (강제로그아웃)",
                actionCategory: "FORCE_LOGOUT",
                detail: `대상 유저: ${s.userId} | IP: ${s.ip} | MAC: ${s.macAddress}`,
                ip: currentUser?.pcInfo?.ip || "127.0.0.1",
                pcInfo: currentUser?.pcInfo?.os || "Console Admin"
              };
              setAuditLogs(logs => [newLog, ...logs]);
              return { ...s, status: "FORCE_TERMINATED", expiresIn: 0 };
            }
            return s;
          }));
        }
      };

      const handleCreateUser = async (newUser) => {
        if (backendStatus === 'ONLINE') {
          await fetch(`${BACKEND_URL}/users`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(newUser)
          });
          syncWithBackend();
        } else {
          // Local update
          const userRecord = {
            ...newUser,
            createdAt: new Date().toISOString().replace('T', ' ').substring(0, 16)
          };
          setUsers(prev => [...prev, userRecord]);
          const newLog = {
            id: Date.now(),
            timestamp: new Date().toISOString().replace('T', ' ').substring(0, 19),
            userId: currentUser?.id || "SYSTEM",
            action: "신규 보안 관리자 계정 생성 (계정생성)",
            actionCategory: "CONFIG",
            detail: `ID: ${newUser.id} | 등급: ${newUser.role}`,
            ip: currentUser?.pcInfo?.ip || "127.0.0.1",
            pcInfo: currentUser?.pcInfo?.os || "Console Admin"
          };
          setAuditLogs(prev => [newLog, ...prev]);
        }
      };

      const renderView = () => {
        switch(currentView) {
          case 'dashboard': return <Dashboard sessions={sessions} auditLogs={auditLogs} users={users} />;
          case 'sessions': return <SessionManager sessions={sessions} onCreateSession={handleCreateSession} onRenewSession={handleRenewSession} onForceLogout={handleForceLogout} />;
          case 'audit': return <AuditLogs auditLogs={auditLogs} />;
          case 'code': return <CodeManager />;
          case 'users': return <UserManager users={users} onCreateUser={handleCreateUser} />;
          case 'redirect': return <RedirectDemo onAddSession={handleCreateSession} />;
          default: return <Dashboard sessions={sessions} auditLogs={auditLogs} users={users} />;
        }
      };

      if (!currentUser) {
        return <Login onLoginSuccess={handleLoginSuccess} />;
      }

      return (
        <div className="app-container">
          <aside className="sidebar">
            <div style={{ padding: '1.5rem', borderBottom: '1px solid var(--border-color)', display: 'flex', alignItems: 'center', gap: '0.75rem' }}>
              <span style={{ fontSize: '1.5rem' }}>🛡️</span>
              <div>
                <h2 style={{ fontSize: '1rem', fontWeight: '800' }}>SECURITY PORTAL</h2>
                <span style={{ fontSize: '0.7rem', color: 'var(--text-muted)' }}>React Standalone Prototype</span>
              </div>
            </div>
            <nav style={{ flexGrow: 1, padding: '1.5rem 0' }}>
              <div className={`nav-item ${currentView === 'dashboard' ? 'active' : ''}`} onClick={() => setCurrentView('dashboard')}>📊 대시보드 홈</div>
              <div className={`nav-item ${currentView === 'sessions' ? 'active' : ''}`} onClick={() => setCurrentView('sessions')}>⚡ Redis 세션 관리</div>
              <div className={`nav-item ${currentView === 'audit' ? 'active' : ''}`} onClick={() => setCurrentView('audit')}>📋 보안 감사 로그</div>
              <div className={`nav-item ${currentView === 'code' ? 'active' : ''}`} onClick={() => setCurrentView('code')}>⚙️ 공통 코드 관리</div>
              <div className={`nav-item ${currentView === 'users' ? 'active' : ''}`} onClick={() => setCurrentView('users')}>👤 사용자 관리</div>
              <div className={`nav-item ${currentView === 'redirect' ? 'active' : ''}`} onClick={() => setCurrentView('redirect')}>🔗 리다이렉트 데모</div>
            </nav>
            <div style={{ padding: '1.25rem', borderTop: '1px solid var(--border-color)', backgroundColor: 'rgba(0,0,0,0.1)' }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: '0.75rem', marginBottom: '0.75rem' }}>
                <div style={{ width: '32px', height: '32px', borderRadius: '50%', backgroundColor: 'var(--accent-blue)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontWeight: '700' }}>
                  {currentUser.name.charAt(0)}
                </div>
                <div>
                  <div style={{ fontSize: '0.85rem', fontWeight: '600' }}>{currentUser.name}</div>
                  <div style={{ fontSize: '0.7rem', color: 'var(--text-secondary)' }}>{currentUser.role}</div>
                </div>
              </div>
              <button onClick={handleLogout} className="btn btn-secondary" style={{ width: '100%', padding: '0.375rem 0.5rem', fontSize: '0.75rem' }}>🔒 로그아웃</button>
            </div>
          </aside>

          <main className="main-content">
            <header className="header">
              <div style={{ display: 'flex', alignItems: 'center', gap: '1rem' }}>
                <span style={{ fontSize: '0.875rem', color: 'var(--text-secondary)' }}>서버 상태:</span>
                <span className={`badge ${backendStatus === 'ONLINE' ? 'badge-success' : 'badge-warning'}`}>
                  {backendStatus === 'ONLINE' ? 'Spring Boot: ONLINE' : 'Spring Boot: OFFLINE (Mock Mode)'}
                </span>
              </div>
              <div style={{ display: 'flex', alignItems: 'center', gap: '1.5rem' }}>
                <div style={{ display: 'flex', gap: '1rem', fontSize: '0.75rem', color: 'var(--text-secondary)' }}>
                  <span><span className={`pulse-indicator ${backendStatus === 'ONLINE' ? 'pulse-green' : 'pulse-orange'}`} /> Redis 클러스터</span>
                  <span><span className={`pulse-indicator ${backendStatus === 'ONLINE' ? 'pulse-green' : 'pulse-orange'}`} /> JPA DB (PostgreSQL)</span>
                </div>
                <div style={{ height: '24px', width: '1px', backgroundColor: 'var(--border-color)' }} />
                <div style={{ fontSize: '0.85rem' }}>접속 IP: <code style={{ color: 'var(--accent-blue)', fontFamily: 'var(--font-mono)' }}>{currentUser.pcInfo?.ip}</code></div>
              </div>
            </header>
            {renderView()}
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
