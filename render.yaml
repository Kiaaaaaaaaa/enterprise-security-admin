# Render.com Blueprint Infrastructure Configuration
services:
  # 1. Spring Boot Web Service (API Server)
  - type: web
    name: admin-api-server
    runtime: java
    buildCommand: ./mvnw clean package -DskipTests
    startCommand: java -jar target/admin-server-1.0.0.jar
    envVars:
      - key: SPRING_REDIS_HOST
        fromService:
          name: cache-redis
          type: redis
          property: host
      - key: SPRING_REDIS_PORT
        fromService:
          name: cache-redis
          type: redis
          property: port
      - key: SPRING_REDIS_PASSWORD
        fromService:
          name: cache-redis
          type: redis
          property: password
      # PostgreSQL Database 자동으로 바인딩
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: security-db
          property: connectionString

  # 2. Redis Instance (자동 생성 및 Git 바인딩)
  - type: redis
    name: cache-redis
    plan: free # 무료 플랜 사용
    ipAllowList: [] # Render 내부 서비스끼리만 통신하도록 제한 (보안 우수)

# 3. PostgreSQL Database (자동 생성 및 Git 바인딩)
databases:
  - name: security-db
    plan: free
